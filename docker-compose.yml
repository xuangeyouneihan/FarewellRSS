services:
  farewell-rss:
    build: .
    image: farewell-rss
    ports:
      # 宿主:容器。改了 FAREWELL_RSS_PORT（容器内监听端口）后，右侧要跟着改
      - "3000:3000"
    volumes:
      - farewell-rss-data:/data
    environment:
      # 在这里覆盖配置（全部可选，见 docs/ENVIRONMENT.md）
      # 改容器内监听端口时，上面 ports 右侧也要同步改
      # FAREWELL_RSS_PORT: "3000"
      # FAREWELL_RSS_ALLOW_REGISTER: "false"
      # FAREWELL_RSS_INVITE_CODE: "your-code"
      FAREWELL_RSS_DATA_DIR: /data
    restart: unless-stopped

volumes:
  farewell-rss-data:
