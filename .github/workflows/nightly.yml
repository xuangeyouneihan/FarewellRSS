name: Nightly (latest dependencies)

"on":
  schedule:
    - cron: "0 3 * * *" # 每天 UTC 03:00（北京时间 11:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-dependencies:
    name: Test with the latest dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # setup-uv 从 v8 起不再发浮动 major 标签（最高只到 v7），所以这里钉全版本号，
      # 升级要手动改（想看有没有新版：gh release list -R astral-sh/setup-uv）
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # 故意 --upgrade：不看 uv.lock，直接拿上游最新版。它只回答一个问题 ——
      # 上游发了新版本之后，这套代码还能不能过测试。
      # （2026-10-01 就是这个组合暴露了「装出来起不来」：SQLAlchemy 2.1
      #   把 greenlet 的平台声明去掉了，而依赖只写了裸的 sqlalchemy>=…）
      - name: Install dependencies, upgrading everything
        run: uv sync --dev --upgrade --index-url https://pypi.org/simple

      # 把解析出来的版本打进日志：失败时第一眼就能看到是哪个包升上来的
      - name: Report resolved versions
        run: uv pip list

      # 里面包含启动冒烟（test/farewell_rss/startup_test.py），所以「最新依赖还能不能起」
      # 也一并验了
      - name: Run backend tests
        run: uv run pytest test/ -q

  # 三个 job 各管一个变量，互不重叠：
  #   latest-dependencies  上游最新依赖 + 3.14（标准构建）
  #   latest-python        我们的 uv.lock + 最新解释器
  #   free-threaded-python 我们的 uv.lock + free-threaded（GIL 关闭）
  #
  # 这后两个都用 --frozen（不重新解析，照 uv.lock 装）：要问的是「我们锁的这套版本，
  # 在这个解释器/平台上装得上、跑得过吗」。这类问题不会白问 —— 之前就真踩过
  # （lock 里的 watchfiles 1.2.0 只能从源码构建）。
  latest-python:
    name: Test with the latest Python
    runs-on: ubuntu-latest
    # 预警语义，不是门禁：新 Python 刚 GA 时依赖方常常还没出对应轮子 —— 实测 3.15 刚发布
    # 那会儿，lock 里的 bcrypt / watchfiles / pyyaml 都还没有 cp315 轮子，安装会退化成现场
    # 编译 Rust/C。那种红不是我们的问题，所以不拿它判整个 nightly 的成败；等上游轮子齐了
    # 它自然转绿，之后才是真正的回归探测器。想让它硬拦，删掉这一行。
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # "3.x" = 最新的正式版（现在解析到 3.15；3.16 GA 之后自动跟过去，不用改文件）。
      # 想更早收到预警（允许预发布版）就换成 "3.16" 再加 allow-prereleases: true。
      - name: Set up Python
        uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.x"

      # setup-uv 从 v8 起不再发浮动 major 标签（最高只到 v7），所以这里钉全版本号，
      # 升级要手动改（想看有没有新版：gh release list -R astral-sh/setup-uv）
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # 显式把 setup-python 装的那个解释器交给 uv：uv 默认偏好它自己管理的版本，不指定
      # 的话可能拿 uv 的 3.14 去建 venv —— 那样这个 job 会全绿，但测的不是最新 Python，
      # 等于白设。
      - name: Install dependencies from the lock
        run: uv sync --dev --frozen --python "${{ steps.python.outputs.python-path }}" --index-url https://pypi.org/simple

      # 失败时第一眼就能看到到底是哪个解释器在跑
      - name: Report the interpreter that actually ran
        run: uv run --frozen python -VV

      - name: Run backend tests
        run: uv run --frozen pytest test/ -q

  free-threaded-python:
    name: Test with free-threaded Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 两个平台各管一件事，别让 ubuntu 红了就把 windows 那份取消掉
      fail-fast: false
      matrix:
        #   ubuntu  —— 生产形态（Docker/Linux）：验代码在 GIL 关闭下还跑不跑得动
        #   windows —— 轮子最稀缺的平台。之前那个缺口（lock 里 watchfiles 1.2.0 只有
        #     manylinux/macOS 的 cp314t 轮子、没有 Windows 的）只发生在这里 ——
        #     只跑 ubuntu 的话同样会漏过去
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # freethreaded 是官方给的输入（@v5 就有）；"3.14t" 这种 t 后缀写法也行。
      # 3.14 的每个补丁版本都有 linux/x64 与 win32/x64 的 free-threaded 构建。
      - name: Set up Python
        uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"
          freethreaded: true

      # setup-uv 从 v8 起不再发浮动 major 标签（最高只到 v7），所以这里钉全版本号，
      # 升级要手动改（想看有没有新版：gh release list -R astral-sh/setup-uv）
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # --frozen 是这个 job 的核心：验的正是「uv.lock 锁的那套版本在 free-threaded 解释器上
      # 装不装得上」。这里绝不能 --upgrade —— 一升就把 watchfiles 解成 1.3.0，缺口被绕过，
      # job 也就白设了。
      #
      # --no-build 同样不能省：缺 wheel 时 uv 会退回源码构建，而 runner 上装了 gcc/rust，
      # 于是一个「用户根本装不上」的包在这里会被现场编译成功 —— job 全绿而问题还在（这正是
      # watchfiles 1.2.0 在 Windows 上的形态：没有 cp314t 轮子，要 Rust）。禁止源码构建之后，
      # 缺轮子会当场变成一条明确的失败。目前 lock 里每个依赖都有 wheel，所以这条不改变现状。
      - name: Install dependencies from the lock
        run: uv sync --dev --frozen --no-build --python "${{ steps.python.outputs.python-path }}" --index-url https://pypi.org/simple

      # 断言 GIL 真的是关的。少了这一句，万一解释器不是 free-threaded（setup-python 没匹配
      # 到、或 uv 换成了自己管理的版本），job 会全绿却什么都没验证 —— t 构建的 GIL 状态受
      # PYTHON_GIL / -X gil 影响，不该靠默认值。（消息用英文：Windows runner 的 pwsh 按本地
      # 代码页处理命令行参数，中文会变乱码）
      - name: Assert the GIL is actually off
        run: uv run --frozen python -c "import sys; print(sys.version); assert not sys._is_gil_enabled(), 'GIL is still enabled - this job verified nothing'"

      - name: Run backend tests
        run: uv run --frozen pytest test/ -q
