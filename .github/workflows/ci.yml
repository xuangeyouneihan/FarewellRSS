name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # setup-uv 从 v8 起不再发浮动 major 标签（最高只到 v7），所以这里钉全版本号，
      # 升级要手动改（想看有没有新版：gh release list -R astral-sh/setup-uv）
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 只检查不改（仓库里的 pnpm lint 带 --fix，进了 CI 会「自动改完然后通过」）
      - name: Run frontend lint
        working-directory: frontend
        run: pnpm lint-check

      - name: Run frontend checks
        working-directory: frontend
        run: pnpm build

      - name: Run frontend unit tests
        working-directory: frontend
        run: pnpm test:unit run

      - name: Install backend dependencies
        run: uv sync --dev --index-url https://pypi.org/simple

      - name: Run backend lint
        run: uv run ruff check

      - name: Run backend type checks
        run: uv run mypy

      - name: Run backend tests
        run: uv run pytest test/ -q

      - name: Build Python package
        run: uv build

      - name: Smoke test the installed wheel
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet "$(ls -t dist/*.whl | head -1)" pytest
          /tmp/smoke/bin/python -m pytest test/farewell_rss/startup_test.py -q

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.whl
          archive: false
          if-no-files-found: error

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          archive: false
          if-no-files-found: error
