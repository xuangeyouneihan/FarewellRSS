name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-pypi:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # setup-uv 从 v8 起不再发浮动 major 标签（最高只到 v7），所以这里钉全版本号，
      # 升级要手动改（想看有没有新版：gh release list -R astral-sh/setup-uv）
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Python package
        run: uv build

      - name: Attach the Python wheel to the release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          files: |
            dist/*.whl

      - name: Publish to PyPI
        run: uv publish --token "${{ secrets.PYPI_API_TOKEN }}"

  publish-docker:
    name: Publish image to Docker Hub
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download Python wheel from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --pattern "*.whl" --dir dist

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            RELEASE=true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/farewell-rss:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/farewell-rss:latest

      - name: Update Docker Hub overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/farewell-rss
          readme-filepath: ./README.md
